name: Verify public document intake
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-intake.txt
      - name: Existing calibration
        run: python -m unittest discover -s tests -v
      - name: Intake structural tests
        run: python -m unittest discover -s intake_tests -v
      - name: Verify source identity and publish provenance
        env:
          WANDB_API_KEY: ${{ secrets.W_B }}
        run: python -m bank_review.intake --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-intake-receipt
          path: intake_output/
          retention-days: 90
