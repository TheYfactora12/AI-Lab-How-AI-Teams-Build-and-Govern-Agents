name: Evaluate V1 and V2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Local gate scorer and policy calibration
        run: |
          mkdir -p evaluation_output
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee evaluation_output/calibration.txt
      - name: Run frozen comparison
        env:
          WANDB_API_KEY: ${{ secrets.W_B }}
          WEAVE_PARALLELISM: '2'
        run: python -m bank_review.evaluate
      - name: Save comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-comparison
          path: evaluation_output/
          retention-days: 90
          if-no-files-found: warn
