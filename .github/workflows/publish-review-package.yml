name: Publish review package
on:
  workflow_dispatch:
    inputs:
      run_sample:
        description: Generate one V1 assessment using W&B inference credits
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Calibrate deterministic scorers
        run: python -m unittest discover -s tests -v
      - name: Publish and verify review data
        env:
          WANDB_API_KEY: ${{ secrets.W_B }}
          RUN_SAMPLE: ${{ inputs.run_sample }}
        run: |
          if [ "$RUN_SAMPLE" = "true" ]; then
            python -m bank_review.publish --sample
          else
            python -m bank_review.publish
          fi
      - name: Save review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-package
          path: review_output/
          retention-days: 90
          if-no-files-found: warn
